name: riscv64-virt
description: Standard RISC-V RV64GC virtual machine
architecture: riscv64
ram_size: 67108864
ram_base: 0x80000000
boot:
  entry_point: 0x80000000
  reset_vector: 0x80000000
  rom:
    base: 0x00001000
    size: 0x1000
devices:
  uart:
    base: 0x10000000
    size: 0x0100
    irq: 10
  clint:
    base: 0x02000000
    size: 0x00010000
    harts: 1
  plic:
    base: 0x0C000000
    size: 0x04000000
    contexts: 1
    max_sources: 32
  block:
    base: 0x20000000
    size: 0x1000
    irq: 1
