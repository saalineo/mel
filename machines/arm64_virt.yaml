name: arm64-virt
description: Standard ARM64 AArch64 virtual machine
architecture: arm64
ram_size: 67108864
ram_base: 0x40000000
boot:
  entry_point: 0x40000000
  reset_vector: 0x40000000
  rom:
    base: 0x00000000
    size: 0x00010000
devices:
  uart:
    base: 0x09000000
    size: 0x0100
    irq: 1
  gic:
    base: 0x08000000
    size: 0x00010000
  block:
    base: 0x20000000
    size: 0x1000
    irq: 2
