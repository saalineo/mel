id: "scenario_06_page_tables"
name: "Identity & Virtual Page Table Builder"
description: "Construct 3-level Sv39 page tables for RAM and UART identity mapping, configure satp register, and enable MMU translation."
architecture: "riscv64"
machine_profile: "riscv64-virt"
timeout_cycles: 100
initial_pc: 0x80000000
provided_tools:
  - "riscv64-unknown-elf-gcc"
  - "debugger"
objectives:
  - type: "memory_contains"
    address: 0x80002010
    expected_bytes: [0xcf, 0x00, 0x02, 0x20]
    description: "Sv39 gigapage PTE for RAM mapped at root page table offset"
  - type: "register_equals"
    register: "a0"
    value: 0x80000000
    description: "Virtual address pointer verified in a0"
  - type: "no_traps"
    description: "No unhandled exceptions or traps"
constraints:
  - type: "max_binary_size"
    bytes: 4096
  - type: "max_execution_cycles"
    cycles: 1000
