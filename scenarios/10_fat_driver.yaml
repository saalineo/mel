id: "scenario_10_fat_driver"
name: "In-Guest FAT Filesystem Driver"
description: "Traverse FAT filesystem on block storage, locate /init.bin, load file clusters into RAM at 0x80006000, and execute."
architecture: "riscv64"
machine_profile: "riscv64-virt"
timeout_cycles: 100
initial_pc: 0x80000000
provided_tools:
  - "riscv64-unknown-elf-gcc"
  - "debugger"
objectives:
  - type: "memory_contains"
    address: 0x80006000
    expected_bytes: [0x13, 0x05, 0x40, 0x06]
    description: "Executable /init.bin loaded into RAM at 0x80006000"
  - type: "register_equals"
    register: "a0"
    value: 100
    description: "Executed /init.bin returning exit code 100 in a0"
  - type: "no_traps"
    description: "No unhandled exceptions or traps"
constraints:
  - type: "max_binary_size"
    bytes: 4096
  - type: "max_execution_cycles"
    cycles: 1000
