[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/memory",
    "crates/bus",
    "crates/cpu",
    "crates/devices",
    "crates/storage",
    "crates/loader",
    "crates/debugger",
    "crates/scenarios",
    "crates/vm",
    "crates/cli",
    "crates/py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["MEL Contributors"]
license = "MIT"
repository = "https://github.com/example/mel"

[workspace.dependencies]
mel-core = { path = "crates/core" }
mel-memory = { path = "crates/memory" }
mel-bus = { path = "crates/bus" }
mel-cpu = { path = "crates/cpu" }
mel-devices = { path = "crates/devices" }
mel-storage = { path = "crates/storage" }
mel-loader = { path = "crates/loader" }
mel-debugger = { path = "crates/debugger" }
mel-scenarios = { path = "crates/scenarios" }
mel-vm = { path = "crates/vm" }
mel-py = { path = "crates/py" }

# Shared external dependencies
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
unicorn-engine = "2.1"
capstone = "0.12"
fatfs = "0.3.6"
object = { version = "0.36", default-features = false, features = ["read", "write", "elf", "std"] }
ratatui = "0.28"
crossterm = "0.28"
vte = "0.13"
pyo3 = { version = "0.22" }
criterion = "0.5"

