[workspace]
resolver = "2"
members = [
    "crates/mel-core",
    "crates/mel-memory",
    "crates/mel-bus",
    "crates/mel-cpu",
    "crates/mel-devices",
    "crates/mel-storage",
    "crates/mel-loader",
    "crates/mel-debugger",
    "crates/mel-scenarios",
    "crates/mel-vm",
    "crates/mel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MEL Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/mel"

[workspace.dependencies]
mel-core = { path = "crates/mel-core" }
mel-memory = { path = "crates/mel-memory" }
mel-bus = { path = "crates/mel-bus" }
mel-cpu = { path = "crates/mel-cpu" }
mel-devices = { path = "crates/mel-devices" }
mel-storage = { path = "crates/mel-storage" }
mel-loader = { path = "crates/mel-loader" }
mel-debugger = { path = "crates/mel-debugger" }
mel-scenarios = { path = "crates/mel-scenarios" }
mel-vm = { path = "crates/mel-vm" }

# Shared external dependencies
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
unicorn-engine = "2.1"
capstone = "0.12"
fatfs = "0.3.6"
object = { version = "0.36", default-features = false, features = ["read", "write", "elf", "std"] }

